[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formal-spec-agent"
version = "0.1.0"
description = "Evidence-producing Protocol IR modeling and agent workflow"
requires-python = ">=3.11"
dependencies = ["z3-solver==4.15.4.0"]

[project.scripts]
formal-spec-agent = "formal_spec_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["formal_spec_agent*", "protocol_lab*"]

[tool.setuptools.package-data]
"protocol_lab.codegen" = ["*.c"]
