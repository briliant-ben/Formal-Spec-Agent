name: Lean expression contracts and acceptance gates
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install checksum-pinned official Lean and the independent framework package
        run: |
          curl --fail --location --connect-timeout 20 --max-time 300 \
            https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst \
            --output /tmp/lean.tar.zst
          echo '7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d  /tmp/lean.tar.zst' | sha256sum --check
          tar --zstd -xf /tmp/lean.tar.zst -C /tmp
          /tmp/lean-4.35.0-linux/bin/lean --version
          python3 -m venv /tmp/lean-framework-venv
          /tmp/lean-framework-venv/bin/python -m pip install '.[z3]'
          python3 -m venv /tmp/lean-only-venv
          /tmp/lean-only-venv/bin/python -m pip install .
      - name: Fetch the immutable TCPIP pure-expression input
        run: |
          mkdir -p /tmp/tcpip-typed-input
          curl --fail --location --connect-timeout 20 --max-time 180 \
            https://raw.githubusercontent.com/briliant-ben/TCPIP-Model/dda2f02f90229146b017421fade8701c74534308/model/ipv4-endpoint-virtual-link.json \
            --output /tmp/tcpip-typed-input/model.json
          echo '7d5a82541ea55cde3ff39b2e1cf883f6c9f942f5dc535a2736e69044d9e154a5  /tmp/tcpip-typed-input/model.json' | sha256sum --check
      - name: Check installed package and actual kernel positive/negative cases
        env:
          FSA_LEAN: /tmp/lean-4.35.0-linux/bin/lean
          FSA_LEAN_REQUIRED: '1'
          FSA_TCPIP_MODEL: /tmp/tcpip-typed-input/model.json
          FSA_TCPIP_REQUIRED: '1'
          FSA_TCPIP_MACHINE_REQUIRED: '1'
        run: |
          cd /tmp
          /tmp/lean-framework-venv/bin/python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v > "$GITHUB_WORKSPACE/lean-tests.log" 2>&1
      - name: Check and freshly recheck the frozen IR expression through the public CLI
        run: |
          TASK_SHA=$(sha256sum examples/lean-bytes/task.json | cut -d ' ' -f 1)
          /tmp/lean-framework-venv/bin/formal-spec-agent lean-check examples/lean-bytes/task.json \
            --workspace examples/lean-bytes --proofs examples/lean-bytes/proofs.json \
            --task-sha256 "$TASK_SHA" --lean /tmp/lean-4.35.0-linux/bin/lean --out /tmp/lean-byte-check
          /tmp/lean-framework-venv/bin/formal-spec-agent lean-verify /tmp/lean-byte-check \
            --task examples/lean-bytes/task.json --workspace examples/lean-bytes \
            --task-sha256 "$TASK_SHA" --lean /tmp/lean-4.35.0-linux/bin/lean --out /tmp/lean-byte-recheck
      - name: Prove Lean-only installation has no Z3 and checks all scoped units
        env:
          FSA_LEAN: /tmp/lean-4.35.0-linux/bin/lean
          FSA_LEAN_REQUIRED: '1'
          FSA_Z3_ABSENT_REQUIRED: '1'
          FSA_TCPIP_MODEL: /tmp/tcpip-typed-input/model.json
          FSA_TCPIP_REQUIRED: '1'
          FSA_TCPIP_MACHINE_REQUIRED: '1'
        run: |
          cd /tmp
          /tmp/lean-only-venv/bin/python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_lean*.py' -v > "$GITHUB_WORKSPACE/lean-only-tests.log" 2>&1
          /tmp/lean-only-venv/bin/python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_no_z3.py' -v >> "$GITHUB_WORKSPACE/lean-only-tests.log" 2>&1
      - name: Check and recheck ordered state transaction without Z3
        run: |
          TASK_SHA=$(sha256sum examples/lean-state/task.json | cut -d ' ' -f 1)
          /tmp/lean-only-venv/bin/formal-spec-agent lean-check examples/lean-state/task.json \
            --workspace examples/lean-state --proofs examples/lean-state/proofs.json \
            --task-sha256 "$TASK_SHA" --lean /tmp/lean-4.35.0-linux/bin/lean --out /tmp/lean-state-check
          /tmp/lean-only-venv/bin/formal-spec-agent lean-verify /tmp/lean-state-check \
            --task examples/lean-state/task.json --workspace examples/lean-state \
            --task-sha256 "$TASK_SHA" --lean /tmp/lean-4.35.0-linux/bin/lean --out /tmp/lean-state-recheck
      - name: Run and audit the complete Lean-backed flow without Z3
        env:
          FSA_LEAN: /tmp/lean-4.35.0-linux/bin/lean
        run: |
          TASK_SHA=$(sha256sum examples/lean-efsm/flow.json | cut -d ' ' -f 1)
          /tmp/lean-only-venv/bin/formal-spec-agent run examples/lean-efsm/flow.json \
            --workspace examples/lean-efsm --task-sha256 "$TASK_SHA" \
            --out /tmp/lean-efsm-flow > lean-flow.log
          /tmp/lean-only-venv/bin/formal-spec-agent verify /tmp/lean-efsm-flow \
            --workspace examples/lean-efsm --task-sha256 "$TASK_SHA" > lean-flow-audit.log
          CONTRACT_SHA=$(sha256sum examples/lean-efsm/task.json | cut -d ' ' -f 1)
          /tmp/lean-only-venv/bin/formal-spec-agent lean-verify /tmp/lean-efsm-flow/stages/formal/queries \
            --task examples/lean-efsm/task.json --workspace examples/lean-efsm \
            --task-sha256 "$CONTRACT_SHA" --lean "$FSA_LEAN" --out /tmp/lean-efsm-recheck
      - name: Check actual C-expression correspondence and compiled Lean reference
        run: |
          TASK_SHA=$(sha256sum examples/lean-c-read/task.json | cut -d ' ' -f 1)
          /tmp/lean-only-venv/bin/formal-spec-agent lean-check examples/lean-c-read/task.json \
            --workspace examples/lean-c-read --proofs examples/lean-c-read/proofs.json \
            --task-sha256 "$TASK_SHA" --lean /tmp/lean-4.35.0-linux/bin/lean --out /tmp/lean-c-read-check
          /tmp/lean-only-venv/bin/formal-spec-agent lean-verify /tmp/lean-c-read-check \
            --task examples/lean-c-read/task.json --workspace examples/lean-c-read \
            --task-sha256 "$TASK_SHA" --lean /tmp/lean-4.35.0-linux/bin/lean --out /tmp/lean-c-read-recheck
          /tmp/lean-only-venv/bin/formal-spec-agent lean-native examples/lean-c-read/task.json \
            --workspace examples/lean-c-read --proofs examples/lean-c-read/proofs.json \
            --task-sha256 "$TASK_SHA" --lean /tmp/lean-4.35.0-linux/bin/lean --out /tmp/lean-native-reference
      - name: Check all compact-case operators and compiled typed values without Z3
        run: |
          TASK_SHA=$(sha256sum examples/lean-values/task.json | cut -d ' ' -f 1)
          /tmp/lean-only-venv/bin/formal-spec-agent lean-check examples/lean-values/task.json \
            --workspace examples/lean-values --proofs examples/lean-values/proofs.json \
            --task-sha256 "$TASK_SHA" --lean /tmp/lean-4.35.0-linux/bin/lean --out /tmp/lean-typed-values
          /tmp/lean-only-venv/bin/formal-spec-agent lean-verify /tmp/lean-typed-values \
            --task examples/lean-values/task.json --workspace examples/lean-values \
            --task-sha256 "$TASK_SHA" --lean /tmp/lean-4.35.0-linux/bin/lean --out /tmp/lean-typed-values-recheck
          /tmp/lean-only-venv/bin/formal-spec-agent lean-native examples/lean-values/task.json \
            --workspace examples/lean-values --proofs examples/lean-values/proofs.json \
            --task-sha256 "$TASK_SHA" --lean /tmp/lean-4.35.0-linux/bin/lean --out /tmp/lean-typed-native
          /tmp/lean-only-venv/bin/formal-spec-agent lean-types /tmp/tcpip-typed-input/model.json \
            --workspace /tmp/tcpip-typed-input --model-sha256 7d5a82541ea55cde3ff39b2e1cf883f6c9f942f5dc535a2736e69044d9e154a5 \
            --lean /tmp/lean-4.35.0-linux/bin/lean --out /tmp/tcpip-typed-view
      - name: Check typed actions and scheduled timers, then run the complete case interpreter
        run: |
          TASK_SHA=$(sha256sum examples/lean-machine/task.json | cut -d ' ' -f 1)
          /tmp/lean-only-venv/bin/formal-spec-agent lean-check examples/lean-machine/task.json \
            --workspace examples/lean-machine --proofs examples/lean-machine/proofs.json \
            --task-sha256 "$TASK_SHA" --lean /tmp/lean-4.35.0-linux/bin/lean --out /tmp/lean-machine-check
          /tmp/lean-only-venv/bin/formal-spec-agent lean-verify /tmp/lean-machine-check \
            --task examples/lean-machine/task.json --workspace examples/lean-machine \
            --task-sha256 "$TASK_SHA" --lean /tmp/lean-4.35.0-linux/bin/lean --out /tmp/lean-machine-recheck
          MODEL_SHA=$(sha256sum examples/lean-machine/model.json | cut -d ' ' -f 1)
          CASES_SHA=$(sha256sum examples/lean-machine/cases.json | cut -d ' ' -f 1)
          /tmp/lean-only-venv/bin/formal-spec-agent lean-machine-run examples/lean-machine/model.json \
            --workspace examples/lean-machine --cases examples/lean-machine/cases.json \
            --model-sha256 "$MODEL_SHA" --cases-sha256 "$CASES_SHA" \
            --lean /tmp/lean-4.35.0-linux/bin/lean --out /tmp/lean-machine-runtime
          cp examples/lean-machine/tcpip-cases.json /tmp/tcpip-typed-input/cases.json
          CASES_SHA=$(sha256sum /tmp/tcpip-typed-input/cases.json | cut -d ' ' -f 1)
          /tmp/lean-only-venv/bin/formal-spec-agent lean-machine-run /tmp/tcpip-typed-input/model.json \
            --workspace /tmp/tcpip-typed-input --cases /tmp/tcpip-typed-input/cases.json \
            --model-sha256 7d5a82541ea55cde3ff39b2e1cf883f6c9f942f5dc535a2736e69044d9e154a5 \
            --cases-sha256 "$CASES_SHA" --lean /tmp/lean-4.35.0-linux/bin/lean --out /tmp/tcpip-machine-runtime
      - name: Preserve raw source, kernel logs, audits and test result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lean-expression-${{ github.sha }}
          path: |
            lean-tests.log
            lean-only-tests.log
            lean-flow.log
            lean-flow-audit.log
            /tmp/lean-byte-check
            /tmp/lean-byte-recheck
            /tmp/lean-c-read-check
            /tmp/lean-c-read-recheck
            /tmp/lean-native-reference
            /tmp/lean-state-check
            /tmp/lean-state-recheck
            /tmp/lean-efsm-flow
            /tmp/lean-efsm-recheck
            /tmp/lean-typed-values
            /tmp/lean-typed-values-recheck
            /tmp/lean-typed-native
            /tmp/tcpip-typed-view
            /tmp/lean-machine-check
            /tmp/lean-machine-recheck
            /tmp/lean-machine-runtime
            /tmp/tcpip-machine-runtime
          if-no-files-found: error
